AWSTemplateFormatVersion: '2010-09-09'
# Fn::ForEach: one set of policies per stage, from a single definition
# (deploy with CAPABILITY_AUTO_EXPAND).
Transform: AWS::LanguageExtensions
Description: >
  grigri-github-deploy: lets GitHub Actions deploy Grigri. A production
  role that only *GA tag runs can assume, and a release-candidate role for
  *RC* tag runs and manual runs from main. Per stage (prod: grigri-*,
  rc: grigri-rc-*), from one definition: the deploy policies. Both trust
  GitHub's OIDC identity provider, which the account already has (from
  presence-github-deploy) unless CreateOidcProvider says otherwise.
  Deployed by an administrator, by hand (see grigri_infra/README.md).

Parameters:
  GitHubRepository:
    Type: String
    Default: prodbytes/grigri
    Description: owner/name of the repository whose tag runs may deploy
  GitHubImmutableRepository:
    Type: String
    Default: prodbytes@288014477/grigri@1415803699
    Description: >
      The same repository in GitHub's immutable subject form,
      owner@<owner id>/name@<repository id>. The repository uses immutable
      OIDC subject claims (gh api repos/<owner>/<name>/actions/oidc/customization/sub
      shows use_immutable_subject and the sub_claim_prefix), so tokens say
      repo:<this>:ref:... rather than repo:owner/name:ref:...
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The site's zone, where its records and certificate validation live (HOSTED_ZONE_ID)
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      true when the account doesn't have the GitHub OIDC provider yet
      (the presence-github-deploy stack already created it in the shared
      account)

# One entry per stage, keyed by its resource-name prefix (every stack,
# bucket, function, alarm and topic of the stage starts with it). Stage is
# the grigri:stage tag on the resources that have no name to scope by
# (CloudFront distributions, ACM certificates); Domain is the site, whose
# records (and subdomains' records) the stage may change. prod's prefix
# also covers grigri-rc-*: the production role is the more trusted one.
Mappings:
  Stages:
    grigri:
      Stage: prod
      Domain: grigri.nu01.com
    grigri-rc:
      Stage: rc
      Domain: rc.grigri.nu01.com

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  Fn::ForEach::Stages:
    - Prefix
    - [grigri, grigri-rc]
    - # The stage's site stack (grigri_infra/site.yaml): CloudFormation, its
      # bucket, the health check's alarm and topic, its DNS records, and
      # CloudFront and ACM by the stage's grigri:stage tag.
      DeployPolicy&{Prefix}:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: !Sub ${Prefix}-github-deploy
          Description: !Sub What the ${Prefix} deploy role may do to the ${Prefix}-* stacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Prefix}-*/*
              - Sid: StackReads
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                Resource: '*'
              # Fn::ForEach (site.yaml)
              - Sid: Transforms
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions
              # The site bucket (named after its stack).
              - Sid: Buckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${Prefix}-*
                  - !Sub arn:${AWS::Partition}:s3:::${Prefix}-*/*
              # The site's health check: Route 53 health checks have no
              # names to scope by, so any in the account.
              - Sid: HealthCheckCreate
                Effect: Allow
                Action: route53:CreateHealthCheck
                Resource: '*'
              - Sid: HealthChecks
                Effect: Allow
                Action:
                  - route53:GetHealthCheck
                  - route53:UpdateHealthCheck
                  - route53:DeleteHealthCheck
                  - route53:ChangeTagsForResource
                  - route53:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:route53:::healthcheck/*
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Prefix}-*
              - Sid: Topics
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:GetSubscriptionAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${Prefix}-*
              # DNS: only the stage's site and the names under it (the
              # certificate's _<token> validation record), never the zone's
              # other records.
              - Sid: Records
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - !FindInMap [Stages, !Ref Prefix, Domain]
                      - !Sub
                        - '*.${Domain}'
                        - Domain: !FindInMap [Stages, !Ref Prefix, Domain]
              - Sid: Zone
                Effect: Allow
                Action:
                  - route53:ListResourceRecordSets
                  - route53:GetHostedZone
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
              - Sid: ZoneReads
                Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ListHostedZones
                Resource: '*'
              # CloudFront: reading is harmless; creating can't touch what
              # exists (an alias already in use is refused).
              - Sid: CloudFrontReads
                Effect: Allow
                Action:
                  - cloudfront:Get*
                  - cloudfront:List*
                  - cloudfront:Describe*
                Resource: '*'
              - Sid: CloudFrontCreate
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateFunction
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:CreateResponseHeadersPolicy
                Resource: '*'
              # Origin access controls and response headers policies have
              # only IDs and take no tags: not separated by stage (see
              # specs/deploy.md).
              - Sid: CloudFrontUntaggable
                Effect: Allow
                Action:
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*
              # Functions by name (${AWS::StackName}-app-index).
              - Sid: CloudFrontFunctions
                Effect: Allow
                Action:
                  - cloudfront:UpdateFunction
                  - cloudfront:PublishFunction
                  - cloudfront:DeleteFunction
                  - cloudfront:TestFunction
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/${Prefix}-*
              # Distributions by their grigri:stage tag.
              - Sid: Distributions
                Effect: Allow
                Action:
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateDistributionWithStagingConfig
                  - cloudfront:DeleteDistribution
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
              # Tagging: only with the stage's tag, on a resource that has it
              # or no tag yet (a new one), and never removing it.
              - Sid: CloudFrontTag
                Effect: Allow
                Action: cloudfront:TagResource
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:RequestTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                  StringEqualsIfExists:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
              - Sid: CloudFrontUntag
                Effect: Allow
                Action: cloudfront:UntagResource
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                  ForAllValues:StringNotEquals:
                    aws:TagKeys: grigri:stage
              # ACM: the same, by the certificate's tag.
              - Sid: CertificateReads
                Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - acm:ListTagsForCertificate
                Resource: '*'
              - Sid: Certificates
                Effect: Allow
                Action:
                  - acm:DeleteCertificate
                  - acm:UpdateCertificateOptions
                Resource: !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
              - Sid: CertificateTag
                Effect: Allow
                Action: acm:AddTagsToCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*
                Condition:
                  StringEquals:
                    aws:RequestTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                  StringEqualsIfExists:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
              - Sid: CertificateUntag
                Effect: Allow
                Action: acm:RemoveTagsFromCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                  ForAllValues:StringNotEquals:
                    aws:TagKeys: grigri:stage
              # Never this stack or its roles.
              - Sid: DenyDeployStack
                Effect: Deny
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/grigri-github-deploy/*
              - Sid: DenyDeployRoles
                Effect: Deny
                Action: iam:*
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/grigri-github-deploy*

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: grigri-github-deploy
      Description: Assumed by GitHub Actions on *GA tags to deploy Grigri
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only tag pushes whose name ends in GA (X.Y.Z-GA), in either
                # subject form (immutable IDs, or owner/name).
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/tags/*GA
                  - !Sub repo:${GitHubRepository}:ref:refs/tags/*GA
      # The grigri stage's policy (Fn::ForEach above).
      ManagedPolicyArns:
        - !Ref DeployPolicygrigri

  RcDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: grigri-github-deploy-rc
      Description: Assumed by GitHub Actions on *RC* tags and manual runs from main, to deploy the Grigri release candidate (rc.grigri.nu01.com)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # *RC* tag pushes (X.Y.Z-RC1), and manual runs from main, in
                # either subject form (immutable IDs, or owner/name).
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/tags/*RC*
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/heads/main
                  - !Sub repo:${GitHubRepository}:ref:refs/tags/*RC*
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/main
      # The grigri-rc stage's policy (Fn::ForEach above).
      ManagedPolicyArns:
        - !Ref DeployPolicygrigrirc

Outputs:
  DeployRoleArn:
    Description: Set as the repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  RcDeployRoleArn:
    Description: Set as the repository variable AWS_DEPLOY_RC_ROLE_ARN
    Value: !GetAtt RcDeployRole.Arn

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  grigri-api (and grigri-rc-api; grigri-local-api in Floci): Grigri's
  backend. One Node.js Lambda with an internal router behind one HTTP API,
  whose JWT authorizer checks Google ID tokens on every route but
  GET /api/health, and one on-demand DynamoDB table (single-table design,
  grigri_api/README.md). Photos live in the site stack's bucket
  (PhotosBucket), uploaded with presigned POSTs. The site's CloudFront
  serves the HTTP API under /api/*. Nothing here costs anything while idle.
  Package with `aws cloudformation package` (Code: dist, from npm run build).

Parameters:
  Stage:
    Type: String
    AllowedValues: [prod, rc, local]
    Description: >
      The grigri:stage tag, and what GET /api/health reports. The seed
      (made-up test data) refuses prod.
  GoogleWebClientId:
    Type: String
    Default: ''
    AllowedPattern: '([0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)?'
    Description: >
      The Google web OAuth client; ID tokens must be issued for it (their
      aud). Required outside local (see Rules). A public identifier, not a
      secret.
  AdminEmails:
    Type: String
    Default: ''
    NoEcho: true
    AllowedPattern: '[A-Za-z0-9._%+@,-]*'
    Description: >
      Who may approve or reject any join request, comma-separated verified
      Google emails (the GRIGRI_ADMIN_EMAILS secret). NoEcho: people's
      emails stay out of the console and logs.
  PhotosBucket:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
    Description: >
      The private photos bucket (the site stack's PhotosBucket,
      <site stack>-photos-<account>); the function presigns uploads to its
      photos/ prefix only.
  PhotosUploadUrl:
    Type: String
    Default: ''
    Description: >
      Local only: where the browser posts photo uploads (Floci's S3, which
      the function reaches at another address). Empty in AWS: the S3
      bucket's own URL.
  DevMode:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: >
      Local only (see Rules): no authorizer, and the caller is whoever the
      X-Grigri-Dev-User header names. For local development without a
      Google client.
  Version:
    Type: String
    Default: dev
    AllowedPattern: '[0-9A-Za-z.+-]{1,40}'
    Description: The release (X.Y.Z), reported by GET /api/health
  PermissionsBoundary:
    Type: String
    Default: ''
    AllowedPattern: '(arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+)?'
    Description: >
      The permissions boundary of the function's role (the stage's
      <prefix>-app-boundary from grigri_infra/github-deploy.yaml; passed by
      scripts/deploy.sh, and required by the deploy roles). Empty locally.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >
      The Lambda's CPU: arm64 in AWS (cheaper per GB-second); the local
      Floci deploy passes the host's, so it runs without emulation.

Rules:
  # Dev mode trusts a header for who's calling: never in RC or prod.
  DevModeIsLocalOnly:
    RuleCondition: !Equals [!Ref DevMode, 'true']
    Assertions:
      - Assert: !Equals [!Ref Stage, local]
        AssertDescription: DevMode is only allowed when Stage is local
  # Outside local, a Google client is required (no client: no token passes).
  GoogleClientOutsideLocal:
    RuleCondition: !Not [!Equals [!Ref Stage, local]]
    Assertions:
      - Assert: !Not [!Equals [!Ref GoogleWebClientId, '']]
        AssertDescription: GoogleWebClientId is required outside local
      - Assert: !Not [!Equals [!Ref PermissionsBoundary, '']]
        AssertDescription: PermissionsBoundary is required outside local

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  IsLocal: !Equals [!Ref Stage, local]
  IsDevMode: !Equals [!Ref DevMode, 'true']
  HasAuthorizer: !Not [!Condition IsDevMode]
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundary, '']]

Resources:
  # Everything Grigri keeps, in one table (grigri_api/README.md, "Data
  # model"). On demand: billed per request and per GB stored, nothing
  # while idle. Kept when the stack goes (Retain); prod also keeps 35 days
  # of point-in-time recovery and refuses deletion.
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AWS::StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Plans by start (PLANS), and open requests (OPENREQ, sparse).
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # A climber's own requests (ASKED#<climberId>).
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: grigri:stage
          Value: !Ref Stage

  # Two weeks of logs: enough to debug, cheap to keep.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: 14
      Tags:
        - Key: grigri:stage
          Value: !Ref Stage

  # Only what the function does: its table, its logs, and uploads (via
  # presigned POSTs) under the photos bucket's photos/ prefix. Its name is
  # <stack>-function, inside the deploy role's <prefix>-* scope, and it
  # carries the stage's permissions boundary.
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-function
      Description: !Sub Grigri API function (${AWS::StackName})
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${LogGroup.Arn}
              - Sid: Table
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt Table.Arn
                  - !Sub ${Table.Arn}/index/*
              - Sid: PhotoUploads
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${PhotosBucket}/photos/*
      Tags:
        - Key: grigri:stage
          Value: !Ref Stage

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref AWS::StackName
      Description: Grigri API (specs/api.md)
      Runtime: nodejs22.x
      Handler: index.handler
      # npm run build's bundle; `aws cloudformation package` uploads it.
      Code: dist
      Architectures:
        - !Ref Architecture
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          STAGE: !Ref Stage
          VERSION: !Ref Version
          TABLE_NAME: !Ref Table
          PHOTOS_BUCKET: !Ref PhotosBucket
          PHOTOS_UPLOAD_URL: !Ref PhotosUploadUrl
          ADMIN_EMAILS: !Ref AdminEmails
          DEV_MODE: !Ref DevMode
          # Reuse TCP connections to DynamoDB between invocations.
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
          NODE_OPTIONS: --enable-source-maps
      Tags:
        - Key: grigri:stage
          Value: !Ref Stage

  # An HTTP API: $1 per million requests (REST APIs are $3.50), with a
  # built-in JWT authorizer.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref AWS::StackName
      ProtocolType: HTTP
      Description: Grigri API, served under /api/* by the site's CloudFront
      Tags: !If
        - IsLocal
        # Floci: a fixed ID, so its CloudFront can allowlist the origin
        # host (grigri_floci/compose.yaml).
        - grigri:stage: !Ref Stage
          floci:override-id: grigri
        - grigri:stage: !Ref Stage

  # Rejects missing, expired, forged or foreign tokens with 401 before the
  # function runs (and before it costs anything).
  GoogleIdToken:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: HasAuthorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: GoogleIdToken
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Issuer: https://accounts.google.com
        Audience:
          - !Ref GoogleWebClientId

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000

  # Public: what's deployed (stage and version).
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/health
      AuthorizationType: NONE
      Target: !Sub integrations/${Integration}

  # Everything else, behind the authorizer (none in dev mode); the
  # function routes it.
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/{proxy+}
      AuthorizationType: !If [HasAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasAuthorizer, !Ref GoogleIdToken, !Ref AWS::NoValue]
      Target: !Sub integrations/${Integration}

  # Throttling caps the bill if someone floods it (every route together).
  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Tags:
        grigri:stage: !Ref Stage

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  ApiDomain:
    Description: The HTTP API's host name (the site distribution's /api/* origin; site.yaml ApiDomainName)
    Value: !Sub ${HttpApi}.execute-api.${AWS::URLSuffix}
  ApiId:
    Value: !Ref HttpApi
  TableName:
    Value: !Ref Table
  FunctionName:
    Description: Invoked with {"grigriSeed":true} to seed RC (scripts/seed.sh)
    Value: !Ref Function

# Deploys a release candidate to https://rc.grigri.nu01.com: every pushed
# tag matching *RC* (e.g. 0.1.202610121200-RC1, from scripts/release-rc.sh),
# or a manual run. It runs scripts/deploy.sh with STAGE=rc, which uses the
# RC's own stacks (grigri-rc-api, seeded with made-up test data, and
# grigri-rc-web), and ends by checking that the RC site and API serve this
# version.
#
# AWS access is keyless: GitHub's OIDC token is exchanged for the
# grigri-github-deploy-rc role (grigri_infra/github-deploy.yaml). That
# role trusts only *RC* tag runs and manual runs from main, and may only
# manage grigri-rc-* resources and the rc.grigri.nu01.com records. Its
# ARN is the repository variable AWS_DEPLOY_RC_ROLE_ARN.
#
# Before anything else, it checks what it deploys: a tag must be an RC tag
# (X.Y.Z-RC or X.Y.Z-RC<n>) whose commit is on main, and a manual run's
# `tag` input must name such an existing tag; a manual run without one
# deploys main's own commit (the RC role only trusts runs from main).
#
# The Release workflow runs on the same tags and publishes the binaries as
# a prerelease.
name: Deploy RC

on:
  push:
    tags:
      - "*RC*"
  workflow_dispatch:
    inputs:
      tag:
        description: RC tag to deploy (X.Y.Z-RC or X.Y.Z-RC<n>, e.g. 0.1.202610121200-RC1). Empty deploys main's commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# One RC deploy at a time; a newer one waits for the running one.
concurrency:
  group: deploy-rc
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"
  # The commit that tag names: the clone is checked against it.
  FLUTTER_COMMIT: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject, which the
    # RC role matches (the tag, or refs/heads/main for manual runs).
    steps:
      # Validated before checkout: only an RC tag name reaches git.
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          elif [[ "$REF" == refs/heads/main ]]; then
            tag=""
          else
            echo "::error::Manual runs deploy main (or an RC tag), not $REF"
            exit 1
          fi
          if [[ -n "$tag" && ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+-RC[0-9]*$ ]]; then
            echo "::error::'$tag' isn't an RC tag (X.Y.Z-RC or X.Y.Z-RC<n>)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying ${tag:-the commit on main} to rc.grigri.nu01.com"

      # Full history, so the commit can be checked against main. A tag is
      # checked out as refs/tags/<tag>, so a branch or SHA of that name
      # can't stand in for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag && format('refs/tags/{0}', steps.tag.outputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit is on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          head="$(git rev-parse HEAD)"
          if [[ -n "$TAG" ]]; then
            if ! commit="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")"; then
              echo "::error::$TAG isn't a tag"
              exit 1
            fi
            if [[ "$head" != "$commit" ]]; then
              echo "::error::checked out $head, not $TAG's $commit"
              exit 1
            fi
          else
            commit="$head"
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${TAG:-$commit} ($commit) isn't on main; only commits on main are deployed"
            exit 1
          fi
          echo "${TAG:-HEAD} is $commit, on main"

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          got="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ "$got" != "$FLUTTER_COMMIT" ]]; then
            echo "::error::Flutter $FLUTTER_VERSION is $got, not the pinned $FLUTTER_COMMIT"
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # The API (grigri_api): Node.js 22, the Lambda's runtime.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Show the toolchain
        run: |
          flutter --version
          aws --version
          node --version

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_RC_ROLE_ARN }}
          role-session-name: grigri-deploy-rc-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ steps.tag.outputs.tag || github.sha }} to RC
        env:
          STAGE: rc
          TAG: ${{ steps.tag.outputs.tag }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          # Who is emailed when the site's health check fails or recovers:
          # a secret, not a variable, so the public run logs never show it.
          GRIGRI_HEALTH_EMAILS: ${{ secrets.GRIGRI_HEALTH_EMAILS }}
          # Google sign-in's web client ID: compiled into the web app, and the
          # client whose ID tokens the API accepts. The RC has its own
          # client (its JavaScript origin is the RC site): a public
          # repository variable, not a secret (specs/sign-in.md).
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID_RC }}
          # Who may approve or reject any join request: a secret, like the
          # health emails.
          GRIGRI_ADMIN_EMAILS: ${{ secrets.GRIGRI_ADMIN_EMAILS }}
        run: bash scripts/deploy.sh

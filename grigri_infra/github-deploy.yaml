AWSTemplateFormatVersion: '2010-09-09'
# Fn::ForEach: one set of policies per stage, from a single definition
# (deploy with CAPABILITY_AUTO_EXPAND).
Transform: AWS::LanguageExtensions
Description: >
  grigri-github-deploy: lets GitHub Actions deploy Grigri. A production
  role that only *GA tag runs can assume, and a release-candidate role for
  *RC* tag runs and manual runs from main. Per stage (prod: grigri-*,
  rc: grigri-rc-*), from one definition: the deploy policies, the
  permissions boundary every role the stage's stacks create must carry,
  and the bucket the API's code is uploaded to. Both trust
  GitHub's OIDC identity provider, which the account already has (from
  presence-github-deploy) unless CreateOidcProvider says otherwise.
  Deployed by an administrator, by hand (see grigri_infra/README.md).

Parameters:
  GitHubRepository:
    Type: String
    Default: prodbytes/grigri
    Description: owner/name of the repository whose tag runs may deploy
  GitHubImmutableRepository:
    Type: String
    Default: prodbytes@288014477/grigri@1415803699
    Description: >
      The same repository in GitHub's immutable subject form,
      owner@<owner id>/name@<repository id>. The repository uses immutable
      OIDC subject claims (gh api repos/<owner>/<name>/actions/oidc/customization/sub
      shows use_immutable_subject and the sub_claim_prefix), so tokens say
      repo:<this>:ref:... rather than repo:owner/name:ref:...
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The site's zone, where its records and certificate validation live (HOSTED_ZONE_ID)
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      true when the account doesn't have the GitHub OIDC provider yet
      (the presence-github-deploy stack already created it in the shared
      account)

# One entry per stage, keyed by its resource-name prefix (every stack,
# bucket, function, alarm and topic of the stage starts with it). Stage is
# the grigri:stage tag on the resources that have no name to scope by
# (CloudFront distributions, ACM certificates); Domain is the site, whose
# records (and subdomains' records) the stage may change; Tenancy is its
# tenancy cost-allocation tag (scripts/deploy.sh's stack tags, with
# project=grigri). prod's prefix also covers grigri-rc-*: the production
# role is the more trusted one.
Mappings:
  Stages:
    grigri:
      Stage: prod
      Domain: grigri.nu01.com
      Tenancy: GA
    grigri-rc:
      Stage: rc
      Domain: rc.grigri.nu01.com
      Tenancy: RC

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  Fn::ForEach::Stages:
    - Prefix
    - [grigri, grigri-rc]
    - # The ceiling of every IAM role the stage's stacks create (the API
      # function's role, grigri_api/template.yaml): the deploy role can only
      # create or change roles that carry it, so a deploy can never make a
      # role that reaches past the stage's own table, logs and photos, or
      # another stage's.
      AppBoundary&{Prefix}:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: !Sub ${Prefix}-app-boundary
          Description: !Sub Permissions boundary of the roles in the ${Prefix}-* stacks (grigri-github-deploy)
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: FunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-*:*
              # The API's table (items only; never the table itself).
              - Sid: Tables
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-*
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-*/index/*
              # Photos, only under photos/ of the stage's photos bucket
              # (site.yaml: <prefix>-web-photos-<account>): uploads (presigned
              # POSTs, tagged pending), clearing that tag when a profile saves
              # them, and deleting the ones a profile drops. Never reads.
              - Sid: Photos
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectTagging
                  - s3:DeleteObjectTagging
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${Prefix}-web-photos-*/photos/*
              # GriGri Pics (site.yaml: <prefix>-web-pics-<account>): the
              # API reads the catalog, nothing else.
              - Sid: PicsCatalog
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${Prefix}-web-pics-*/pics/catalog.json
              # Live updates: the API publishes hints to the stage's
              # climbers' MQTT topics only (grigri/<stage>/climbers/*).
              - Sid: Hints
                Effect: Allow
                Action: iot:Publish
                Resource: !Sub
                  - arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/grigri/${Stage}/climbers/*
                  - Stage: !FindInMap [Stages, !Ref Prefix, Stage]

      # Where scripts/deploy.sh uploads the API's code (aws cloudformation
      # package --s3-bucket), one bucket per stage: the RC role can't write
      # production's code. Its settings stay the administrator's (denied
      # to the deploy roles below).
      ArtifactBucket&{Prefix}:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          BucketName: !Sub ${Prefix}-artifacts-${AWS::AccountId}
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          OwnershipControls:
            Rules:
              - ObjectOwnership: BucketOwnerEnforced
          LifecycleConfiguration:
            Rules:
              # A deploy only needs its own upload; old ones are clutter.
              - Id: expire-old-artifacts
                Status: Enabled
                ExpirationInDays: 30
              - Id: abort-incomplete-uploads
                Status: Enabled
                AbortIncompleteMultipartUpload:
                  DaysAfterInitiation: 1

      # The stage's API stack (grigri_api/template.yaml): its Lambda
      # functions (the API's and the live updates' IoT authorizer), IoT
      # authorizer, HTTP API, DynamoDB table, log groups and roles. A
      # second policy, since one managed policy holds at most 6,144
      # characters.
      ApiDeployPolicy&{Prefix}:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: !Sub ${Prefix}-github-deploy-api
          Description: !Sub What the ${Prefix} deploy role may do to the ${Prefix}-api stack's resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The function, by name (FunctionName is the stack's name).
              - Sid: Functions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:ListVersionsByFunction
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionConcurrency
                  - lambda:GetFunctionRecursionConfig
                  - lambda:PutFunctionRecursionConfig
                  - lambda:GetRuntimeManagementConfig
                  - lambda:PutRuntimeManagementConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefix}-*
              # The RC seed (scripts/seed.sh invokes the RC function with
              # {"grigriSeed": true}). Never production's function, which
              # refuses to seed anyway.
              - Sid: SeedRc
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:grigri-rc-api
              # HTTP APIs have only IDs, no names to scope by: any in the
              # account (as in prodbytes/presence; see specs/deploy.md).
              - Sid: HttpApis
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  # Tagging is POST and DELETE on /tags/*, plus these on
                  # creates (the HTTP API's stage).
                  - apigateway:DELETE
                  - apigateway:TagResource
                  - apigateway:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
              # Live updates: the IoT custom authorizer (<prefix>-api-realtime),
              # by name; the endpoint lookup (scripts/deploy.sh) has no
              # resource to scope by.
              - Sid: IotAuthorizers
                Effect: Allow
                Action:
                  - iot:CreateAuthorizer
                  - iot:UpdateAuthorizer
                  - iot:DeleteAuthorizer
                  - iot:DescribeAuthorizer
                  - iot:TagResource
                  - iot:UntagResource
                  - iot:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:authorizer/${Prefix}-*
              - Sid: IotEndpoint
                Effect: Allow
                Action: iot:DescribeEndpoint
                Resource: '*'
              # The table, by name. No DeleteTable and no item access: a
              # deploy can't drop or read people's data (the table is
              # DeletionPolicy Retain, so CloudFormation never deletes it).
              - Sid: Tables
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContributorInsights
                  - dynamodb:DescribeKinesisStreamingDestination
                  - dynamodb:GetResourcePolicy
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-*
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-*/index/*
              # The function's log group, by name.
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  - logs:TagLogGroup
                  - logs:UntagLogGroup
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-*:*
              - Sid: LogGroupReads
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              # IAM: the function's role (<prefix>-api-function), created
              # and given permissions only with the stage's boundary on it,
              # so its inline policy can never grant more than the boundary.
              - Sid: RolesWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:PutRolePermissionsBoundary
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Prefix}-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Prefix}-app-boundary
              # Reading, tagging and taking permissions away need no boundary.
              - Sid: Roles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Prefix}-*
              - Sid: PassRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Prefix}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # scripts/deploy.sh checks the boundary exists before deploying.
              - Sid: Boundary
                Effect: Allow
                Action: iam:GetPolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Prefix}-app-boundary
              # Never remove a role's boundary, or a deploy role's own.
              - Sid: DenyRemovingBoundaries
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'
              - Sid: DenyDeployRoles
                Effect: Deny
                Action: iam:*
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/grigri-github-deploy*
              # The artifact buckets' settings stay the administrator's.
              - Sid: DenyArtifactBucketSettings
                Effect: Deny
                Action:
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketAcl
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::grigri-artifacts-${AWS::AccountId}
                  - !Sub arn:${AWS::Partition}:s3:::grigri-rc-artifacts-${AWS::AccountId}
              # People's photos: a deploy manages the bucket (site.yaml),
              # never its objects, and never deletes it.
              - Sid: DenyPhotos
                Effect: Deny
                Action:
                  - s3:GetObject*
                  - s3:PutObject*
                  - s3:DeleteObject*
                  - s3:DeleteBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::grigri-web-photos-${AWS::AccountId}
                  - !Sub arn:${AWS::Partition}:s3:::grigri-web-photos-${AWS::AccountId}/*
                  - !Sub arn:${AWS::Partition}:s3:::grigri-rc-web-photos-${AWS::AccountId}
                  - !Sub arn:${AWS::Partition}:s3:::grigri-rc-web-photos-${AWS::AccountId}/*

      # The stage's site stack (grigri_infra/site.yaml): CloudFormation, its
      # bucket, its DNS records, and CloudFront and ACM by the stage's
      # grigri:stage tag.
      DeployPolicy&{Prefix}:
        Type: AWS::IAM::ManagedPolicy
        Properties:
          ManagedPolicyName: !Sub ${Prefix}-github-deploy
          Description: !Sub What the ${Prefix} deploy role may do to the ${Prefix}-* stacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Prefix}-*/*
              - Sid: StackReads
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                Resource: '*'
              # Fn::ForEach (site.yaml)
              - Sid: Transforms
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions
              # The site and photos buckets (named after the site stack) and
              # the stage's artifact bucket (its settings, and the photos'
              # objects, are denied in the API policy).
              - Sid: Buckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${Prefix}-*
                  - !Sub arn:${AWS::Partition}:s3:::${Prefix}-*/*
              # The site's former Route 53 health checks, their alarms and
              # SNS topic (now the central nu01-monitor's job): kept only so
              # CloudFormation can delete them on the next deploy. Drop
              # HealthCheckCreate, HealthChecks, Alarms and Topics after the
              # next GA (and RC) deploy. Health checks have no names to
              # scope by, so any in the account.
              - Sid: HealthCheckCreate
                Effect: Allow
                Action: route53:CreateHealthCheck
                Resource: '*'
              - Sid: HealthChecks
                Effect: Allow
                Action:
                  - route53:GetHealthCheck
                  - route53:UpdateHealthCheck
                  - route53:DeleteHealthCheck
                  - route53:ChangeTagsForResource
                  - route53:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:route53:::healthcheck/*
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Prefix}-*
              - Sid: Topics
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:GetSubscriptionAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${Prefix}-*
              # DNS: only the stage's site and the names under it (the
              # certificate's _<token> validation record), never the zone's
              # other records.
              - Sid: Records
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - !FindInMap [Stages, !Ref Prefix, Domain]
                      - !Sub
                        - '*.${Domain}'
                        - Domain: !FindInMap [Stages, !Ref Prefix, Domain]
              - Sid: Zone
                Effect: Allow
                Action:
                  - route53:ListResourceRecordSets
                  - route53:GetHostedZone
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
              - Sid: ZoneReads
                Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ListHostedZones
                Resource: '*'
              # CloudFront: reading is harmless; creating can't touch what
              # exists (an alias already in use is refused).
              - Sid: CloudFrontReads
                Effect: Allow
                Action:
                  - cloudfront:Get*
                  - cloudfront:List*
                  - cloudfront:Describe*
                Resource: '*'
              - Sid: CloudFrontCreate
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateFunction
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:CreateCachePolicy
                Resource: '*'
              # Origin access controls, response headers policies and cache
              # policies have only IDs and take no tags: not separated by
              # stage (see specs/deploy.md).
              - Sid: CloudFrontUntaggable
                Effect: Allow
                Action:
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:UpdateCachePolicy
                  - cloudfront:DeleteCachePolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:cache-policy/*
              # Functions by name (${AWS::StackName}-app-index).
              - Sid: CloudFrontFunctions
                Effect: Allow
                Action:
                  - cloudfront:UpdateFunction
                  - cloudfront:PublishFunction
                  - cloudfront:DeleteFunction
                  - cloudfront:TestFunction
                  # The stack's cost-allocation tags reach functions too.
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/${Prefix}-*
              # Distributions by their grigri:stage tag.
              - Sid: Distributions
                Effect: Allow
                Action:
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateDistributionWithStagingConfig
                  - cloudfront:DeleteDistribution
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
              # Tagging: only with the stage's tag, on a resource that has it
              # or no tag yet (a new one), and never removing it.
              - Sid: CloudFrontTag
                Effect: Allow
                Action: cloudfront:TagResource
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:RequestTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                  StringEqualsIfExists:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
              - Sid: CloudFrontUntag
                Effect: Allow
                Action: cloudfront:UntagResource
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                  ForAllValues:StringNotEquals:
                    aws:TagKeys: grigri:stage
              # ACM: the same, by the certificate's tag.
              - Sid: CertificateReads
                Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - acm:ListTagsForCertificate
                Resource: '*'
              - Sid: Certificates
                Effect: Allow
                Action:
                  - acm:DeleteCertificate
                  - acm:UpdateCertificateOptions
                Resource: !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
              - Sid: CertificateTag
                Effect: Allow
                Action: acm:AddTagsToCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*
                Condition:
                  StringEquals:
                    aws:RequestTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                  StringEqualsIfExists:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
              - Sid: CertificateUntag
                Effect: Allow
                Action: acm:RemoveTagsFromCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                  ForAllValues:StringNotEquals:
                    aws:TagKeys: grigri:stage
              # The cost-allocation stack tags (project, tenancy), which
              # CloudFormation adds to an existing distribution or certificate
              # without its grigri:stage tag in the same request.
              - Sid: CostTags
                Effect: Allow
                Action:
                  - cloudfront:TagResource
                  - acm:AddTagsToCertificate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                  - !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                  StringEqualsIfExists:
                    aws:RequestTag/grigri:stage: !FindInMap [Stages, !Ref Prefix, Stage]
                    aws:RequestTag/project: grigri
                    aws:RequestTag/tenancy: !FindInMap [Stages, !Ref Prefix, Tenancy]
                  ForAllValues:StringEquals:
                    aws:TagKeys: [grigri:stage, project, tenancy]
              # Never this stack or its roles.
              - Sid: DenyDeployStack
                Effect: Deny
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/grigri-github-deploy/*
              - Sid: DenyDeployRoles
                Effect: Deny
                Action: iam:*
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/grigri-github-deploy*

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: grigri-github-deploy
      Description: Assumed by GitHub Actions on *GA tags to deploy Grigri
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only tag pushes whose name ends in GA (X.Y.Z-GA), in either
                # subject form (immutable IDs, or owner/name).
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/tags/*GA
                  - !Sub repo:${GitHubRepository}:ref:refs/tags/*GA
      # The grigri stage's policies (Fn::ForEach above).
      ManagedPolicyArns:
        - !Ref DeployPolicygrigri
        - !Ref ApiDeployPolicygrigri

  RcDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: grigri-github-deploy-rc
      Description: Assumed by GitHub Actions on *RC* tags and manual runs from main, to deploy the Grigri release candidate (rc.grigri.nu01.com)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # *RC* tag pushes (X.Y.Z-RC1), and manual runs from main, in
                # either subject form (immutable IDs, or owner/name).
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/tags/*RC*
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/heads/main
                  - !Sub repo:${GitHubRepository}:ref:refs/tags/*RC*
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/main
      # The grigri-rc stage's policies (Fn::ForEach above).
      ManagedPolicyArns:
        - !Ref DeployPolicygrigrirc
        - !Ref ApiDeployPolicygrigrirc

Outputs:
  ArtifactBucket:
    Description: Where the production deploy uploads the API's code
    Value: !Ref ArtifactBucketgrigri
  RcArtifactBucket:
    Description: Where the RC deploy uploads the API's code
    Value: !Ref ArtifactBucketgrigrirc
  DeployRoleArn:
    Description: Set as the repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  RcDeployRoleArn:
    Description: Set as the repository variable AWS_DEPLOY_RC_ROLE_ARN
    Value: !GetAtt RcDeployRole.Arn

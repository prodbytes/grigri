version: "0.5"

processes:
  0-health-check:
    command: bash scripts/health-check.sh
    environment:
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-15}
      - INDEX_PORT=${INDEX_PORT:-2113}
      - FLUTTER_WEB_PORT=${FLUTTER_WEB_PORT:-7189}
      - FLOCI_PORT=${FLOCI_PORT:-2114}
      - FLOCI_HTTPS_PORT=${FLOCI_HTTPS_PORT:-2543}
      - GRIGRI_CDN_ALIAS=${GRIGRI_CDN_ALIAS:-grigri.localhost}
      - GRIGRI_PUBLIC_HOST=${GRIGRI_PUBLIC_HOST:-local.grigri.nu01.com}
      - RBACR_PORT=${RBACR_PORT:-2115}
    # Start logging once every service passes its readiness probe, so the
    # first status line reflects a fully started stack.
    depends_on:
      2-flutter-web:
        condition: process_healthy
      4-floci:
        condition: process_healthy
      5-index:
        condition: process_healthy
    availability:
      restart: on_failure
      backoff_seconds: 5

  1-rbacr:
    # rbacr's dev server (prodbytes/rbacr-local), which the local API asks
    # for admins and the user's roles: rbacr's README, "Local rbacr for your
    # app". It reads RBACR_TOKEN from .env (process-compose loads it), the
    # same root token the local API sends; without one it generates a token
    # and logs it, to copy into .env. Roots: dev@rbacr.local. Its own
    # container and volume, so it runs beside presence's. The app never
    # calls it (no CORS).
    command: >-
      docker run --rm --name grigri-rbacr
      -p "127.0.0.1:${RBACR_PORT:-2115}:8686"
      -e "RBACR_TOKEN=${RBACR_TOKEN:-}"
      -v grigri-rbacr-data:/data
      prodbytes/rbacr-local:latest
    shutdown:
      command: docker stop grigri-rbacr
      timeout_seconds: 30
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${RBACR_PORT:-2115}
        path: /health
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 30
    availability:
      restart: on_failure
      backoff_seconds: 5

  7-rbacr-setup:
    # Grigri's roles in the local rbacr (admin, premium, blocked and the
    # RC's -rc ones; admin implies both Premiums), with .env's RBACR_TOKEN, once it's up
    # (scripts/rbacr-setup.sh; idempotent). Without a token: nothing.
    command: >-
      bash -c 'if [ -n "$${RBACR_TOKEN:-}" ]; then
      RBACR_URL=http://127.0.0.1:$${RBACR_PORT:-2115} bash scripts/rbacr-setup.sh;
      else echo "no RBACR_TOKEN in .env, so rbacr is not set up"; fi'
    environment:
      - RBACR_PORT=${RBACR_PORT:-2115}
    depends_on:
      1-rbacr:
        condition: process_healthy
    availability:
      restart: "no"

  2-flutter-web:
    command: bash scripts/flutter-web.sh
    environment:
      - FLUTTER_WEB_PORT=${FLUTTER_WEB_PORT:-7189}
    # Stopping only the script leaves flutter's dart process serving the
    # old build on the port, and the next start then fails to bind it. Stop
    # whatever listens on the port (flutter's wrapper exits with it).
    shutdown:
      command: lsof -tiTCP:${FLUTTER_WEB_PORT:-7189} -sTCP:LISTEN | xargs kill 2>/dev/null; true
      timeout_seconds: 10
    readiness_probe:
      http_get:
        host: localhost
        port: ${FLUTTER_WEB_PORT:-7189}
        path: /app/
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 150
    availability:
      restart: on_failure
      backoff_seconds: 5

  4-floci:
    # Floci as the local CloudFront, over HTTP and HTTPS, and the local AWS
    # the API runs in (grigri_floci/). The mkcert certificate is generated
    # first, when missing or stale, and so is the API build, which Floci
    # deploys and seeds (05-api.sh), with the local site's Google web client
    # (.env's GOOGLE_WEB_CLIENT_ID_LOCAL, else GOOGLE_WEB_CLIENT_ID; none: dev
    # mode), the one the local web app signs in with (flutter-web.sh), and RBACR_TOKEN (the local rbacr's root token, with which the
    # API asks who holds grigri's admin role) from .env.
    command: bash scripts/local-certs.sh && bash scripts/build-api.sh && GOOGLE_WEB_CLIENT_ID="$(sed -n 's/^GOOGLE_WEB_CLIENT_ID_LOCAL=//p' .env 2>/dev/null | tail -1)" && GOOGLE_WEB_CLIENT_ID="$${GOOGLE_WEB_CLIENT_ID:-$(sed -n 's/^GOOGLE_WEB_CLIENT_ID=//p' .env 2>/dev/null | tail -1)}" RBACR_TOKEN="$(sed -n 's/^RBACR_TOKEN=//p' .env 2>/dev/null | tail -1)" docker compose -f grigri_floci/compose.yaml up floci
    environment:
      - FLOCI_PORT=${FLOCI_PORT:-2114}
      - FLOCI_HTTPS_PORT=${FLOCI_HTTPS_PORT:-2543}
    shutdown:
      # Also removes the API's Lambda containers, which Floci starts beside
      # itself.
      command: docker compose -f grigri_floci/compose.yaml down; docker ps -aq --filter label=io.floci.service=lambda --filter name=grigri-lambda | xargs docker rm -f >/dev/null 2>&1; true
      timeout_seconds: 30
    readiness_probe:
      exec:
        command: curl -fs http://localhost:${FLOCI_PORT:-2114}/_floci/init | grep -q '"ready":true'
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      # Up to 6 minutes: the first run pulls the images and builds the API.
      failure_threshold: 180
    availability:
      # Always, not on_failure: when the container is stopped from outside
      # (a `docker compose down`), `compose up` exits 0, and the CDN and
      # HTTPS would stay down until a manual restart.
      restart: always
      backoff_seconds: 5

  6-pics:
    # GriGri Pics in the local Floci: loads them whenever Floci (which
    # keeps nothing) has none, from photos cached on the host
    # (scripts/pics-local.sh, grigri_api/pics/load.mjs).
    command: bash scripts/pics-local.sh
    environment:
      - FLOCI_PORT=${FLOCI_PORT:-2114}
    depends_on:
      4-floci:
        condition: process_healthy
    availability:
      restart: on_failure
      backoff_seconds: 5

  5-index:
    # The site root (grigri_index/site), the landing page. Floci's
    # distribution uses it as the default origin.
    # GRIGRI_BIND_HOST: see scripts/flutter-web.sh.
    command: python3 -m http.server ${INDEX_PORT:-2113} --bind ${GRIGRI_BIND_HOST:-127.0.0.1} --directory grigri_index/site
    readiness_probe:
      http_get:
        host: localhost
        port: ${INDEX_PORT:-2113}
        path: /
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 30
    availability:
      restart: on_failure
      backoff_seconds: 5

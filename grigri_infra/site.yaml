AWSTemplateFormatVersion: '2010-09-09'
Description: >
  grigri-web: the site at https://grigri.nu01.com (and, as grigri-rc-web,
  https://rc.grigri.nu01.com). One CloudFront distribution in front of the
  index page (/) and the Flutter web app (/app/), both from a private S3
  bucket, the API (/api/*, the grigri_api stack's HTTP API) and people's
  photos (/photos/*, a private bucket) and GriGri Pics, Grigri's own crag
  photos (/pics/*, a bucket of their own). Uptime is watched from outside,
  by the central nu01-monitor (/app/version.json and /api/health).
  Deploy in us-east-1 (CloudFront certificates must live there).

Parameters:
  DomainName:
    Type: String
    Default: grigri.nu01.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The public zone of DomainName, grigri.nu01.com's own (HOSTED_ZONE_ID)
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod, rc]
    Description: >
      The grigri:stage tag on the certificate and distribution, which the
      deploy roles (grigri_infra/github-deploy.yaml) are scoped by: prod,
      or rc for grigri-rc-web.
  ApiDomainName:
    Type: String
    AllowedPattern: '[a-z0-9]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com'
    Description: >
      The API's execute-api host name (the <prefix>-api stack's ApiDomain
      output, grigri_api/template.yaml); scripts/deploy.sh deploys that
      stack first and passes it.
  IotEndpoint:
    Type: String
    Default: ''
    AllowedPattern: '([a-z0-9-]+\.iot\.[a-z0-9-]+\.amazonaws\.com)?'
    Description: >
      Live updates: the account's IoT Data-ATS endpoint, which the web app
      connects to over WebSocket (wss://<it>/mqtt); scripts/deploy.sh looks
      it up (aws iot describe-endpoint --endpoint-type iot:Data-ATS). The
      CSP's connect-src allows it. Empty: none (the app keeps polling).

Conditions:
  HasIot: !Not [!Equals [!Ref IotEndpoint, '']]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: grigri:stage
          Value: !Ref Stage

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # People's photos (profile and gear) and chat media (photos and videos,
  # under photos/chat/<plan>/), uploaded by the app with presigned POSTs
  # the API issues (under photos/), and served by this distribution under
  # /photos/* (the path is the key, so objects live under photos/).
  # Private: only this distribution reads it. Deterministic name, so the
  # API stack, deployed first, can grant its function uploads to it. Kept
  # when the stack goes (Retain): it's people's data.
  PhotosBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-photos-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # The web app posts uploads straight to the bucket (its own origin).
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Sub https://${DomainName}
            AllowedMethods: [POST]
            AllowedHeaders: ['*']
            MaxAge: 3000
      # Uploads arrive tagged grigri-pending=true (the API's presigned
      # POSTs); saving a profile clears the tag of its photos, and deletes
      # the ones it drops; sending a chat message clears its attachment's,
      # and adding a photo to a plan its own. Uploads never saved, sent or
      # added expire after a day. Saved photos stay until their owner
      # replaces them. Chat media and plan photos ("Your Pics") expire 400
      # days after their upload: a plan starts at most a year after it's
      # made, so that's at least a month after the plan is over. Failed
      # multipart uploads are cleaned up too.
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: expire-pending-photos
            Status: Enabled
            Prefix: photos/
            TagFilters:
              - Key: grigri-pending
                Value: 'true'
            ExpirationInDays: 1
          - Id: expire-chat-media
            Status: Enabled
            Prefix: photos/chat/
            ExpirationInDays: 400
          - Id: expire-plan-pics
            Status: Enabled
            Prefix: photos/plans/
            ExpirationInDays: 400
      Tags:
        - Key: grigri:stage
          Value: !Ref Stage

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only this distribution may read photos.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${PhotosBucket.Arn}/photos/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          # Uploads (presigned POSTs) and reads only over HTTPS.
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt PhotosBucket.Arn
              - !Sub ${PhotosBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # GriGri Pics (specs/pics.md): Grigri's own photos of crags, freely
  # licensed (credited in each photo's S3 annotation), under pics/crags/,
  # and pics/catalog.json, made from the annotations, which the API reads.
  # Its own bucket, apart from people's data: loaded by scripts/deploy.sh
  # (grigri_api/pics/load.mjs), served by this distribution under
  # /pics/*. Not retained: it can be loaded again from crags.json.
  PicsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-pics-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: grigri:stage
          Value: !Ref Stage

  PicsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PicsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only this distribution may read the photos (not the catalog,
          # which only the API reads).
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${PicsBucket.Arn}/pics/crags/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt PicsBucket.Arn
              - !Sub ${PicsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only this distribution may read the bucket.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          # S3 answers 403 for a missing key unless ListBucket is allowed;
          # this lets unknown paths return 404 instead.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # /app -> /app/ (a redirect), and any directory URI -> its index.html, so
  # /app/ serves app/index.html from S3.
  AppIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-app-index
      AutoPublish: true
      FunctionConfig:
        Comment: Directory URIs to index.html; /app to /app/
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/app') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: '/app/' } }
            };
          }
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          }
          return request;
        }

  # The Flutter web app's headers: AWS's managed security headers
  # (HSTS, nosniff, Referrer-Policy, X-XSS-Protection) plus a Content
  # Security Policy for what the app loads, and Permissions-Policy. See
  # specs/deploy.md (Response headers):
  # - script-src: the app and CanvasKit (www.gstatic.com/flutter-canvaskit);
  #   'wasm-unsafe-eval' compiles CanvasKit's WebAssembly.
  # - style-src 'unsafe-inline': Flutter's engine injects <style> elements
  #   and style attributes.
  # - connect-src: CanvasKit and Google's fonts, which Flutter downloads;
  #   the API is 'self' (/api/*); photo uploads go to the photos bucket;
  #   live updates are MQTT over WebSocket to the account's IoT endpoint.
  # - img-src: photos are 'self' (/photos/*); Google account pictures
  #   (lh3.googleusercontent.com, the sign-in button's too).
  # - Google Identity Services (sign-in): its script, style, frame and
  #   calls under https://accounts.google.com/gsi/.
  # frame-ancestors 'none' (and X-Frame-Options DENY): nothing may frame it.
  AppHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-app
        Comment: Grigri web app (/app/) security headers, CSP and Permissions-Policy
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub
              - >-
                default-src 'self';
                script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com/flutter-canvaskit/ https://accounts.google.com/gsi/client;
                style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style;
                img-src 'self' data: blob: https://lh3.googleusercontent.com;
                font-src 'self' data: https://fonts.gstatic.com;
                connect-src 'self' blob: data: https://www.gstatic.com https://fonts.gstatic.com https://accounts.google.com/gsi/ https://${PhotosBucket}.s3.${AWS::Region}.amazonaws.com${Realtime};
                frame-src https://accounts.google.com/gsi/;
                worker-src 'self' blob:;
                manifest-src 'self';
                object-src 'none';
                base-uri 'self';
                form-action 'self';
                frame-ancestors 'none'
              - Realtime: !If [HasIot, !Sub ' wss://${IotEndpoint}', '']
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
        CustomHeadersConfig:
          Items:
            # The app takes where I climb from the browser's location
            # (specs/matching.md); nothing needs the camera or microphone.
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(self)
              Override: true

  # The index page (/): its only script is the redirect to /app/, allowed
  # by its hash (update it if grigri_index/site/index.html's <script>
  # changes; the meta refresh still redirects if it doesn't match).
  IndexHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-index
        Comment: Grigri index (/) security headers and CSP
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'none';
              script-src 'sha256-AKfnPi3vZ46xMn5ssxBaCzpOf77ER2OwJeWySFPo0cU=';
              style-src 'self';
              img-src 'self';
              base-uri 'none';
              form-action 'none';
              frame-ancestors 'none'
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=()
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: grigri:stage
          Value: !Ref Stage
      DistributionConfig:
        Comment: !Sub Grigri (${DomainName})
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # People's photos; the same origin access control signs requests.
          - Id: photos
            DomainName: !GetAtt PhotosBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # GriGri Pics; the same origin access control signs requests.
          - Id: pics
            DomainName: !GetAtt PicsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # The API's HTTP API, default stage: no origin path
          # (/api/plans -> /api/plans).
          - Id: api
            DomainName: !Ref ApiDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        # The index page at / (redirects to /app/)
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref IndexHeadersPolicy
        CacheBehaviors:
          # The Flutter web app, built with --base-href /app/
          - PathPattern: /app*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: !Ref AppHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt AppIndexFunction.FunctionMetadata.FunctionARN
          # The API: nothing cached; every viewer header but Host is
          # forwarded, Authorization (the session token) included; all
          # methods.
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          # Photos: keys are never reused, so they're cached at the edge.
          - PathPattern: /photos/*
            TargetOriginId: photos
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          # GriGri Pics: keys follow their source, never reused, so they're
          # cached at the edge too.
          - PathPattern: /pics/*
            TargetOriginId: pics
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy

  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's alias zone
        EvaluateTargetHealth: false

  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Value: !Sub https://${DomainName}/
  SiteBucketName:
    Description: Upload index.html at the root and the web build under app/
    Value: !Ref SiteBucket
  PhotosBucketName:
    Description: People's photos (under photos/), served at /photos/*
    Value: !Ref PhotosBucket
  PicsBucketName:
    Description: GriGri Pics (under pics/), served at /pics/*
    Value: !Ref PicsBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
